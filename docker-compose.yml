# Local development infrastructure, and only infrastructure. The app itself runs on the host
# under `hf dev`, which is what sets `HF_BUILD_SHA=dev-<timestamp>` — a version the worker will
# accept and no deploy will ever collide with.
#
# `docker-compose.prod.yml` is the deployed stack and shares nothing with this file.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: __DB_NAME__
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data

  # Where `emailOTP` codes land in development. `SMTP_URL=smtp://localhost:1025` in `.env`,
  # inbox at http://localhost:8025 — the same var production points at Postmark.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres:

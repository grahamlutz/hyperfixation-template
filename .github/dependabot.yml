version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR, not twenty. The app's contract suite is what reviews a dependency bump, and
      # running it twenty times for twenty single-package PRs buys nothing.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # `core-bump.yml` moves these, all together. Dependabot bumping one of eight would
      # produce exactly the mixed version set the lockstep release exists to prevent.
      - dependency-name: "@hyperfixation/*"
      # Pinned to one exact version across every package so `DBOS` is one object in a process.
      - dependency-name: "@dbos-inc/dbos-sdk"
      # `typescript` is held at ~5.9 by typescript-eslint's peer range (`<6.1.0`) — see the
      # `//typescript` note in package.json. A major here does not fail the lint, it stops it
      # starting, so the PR is unmergeable by construction. Minor and patch still come through.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The image's base is `node:22-alpine` and `engines.node` is `>=22`; a Node major is a
      # decision about the runtime the app is tested on, not a dependency bump. Patch and minor
      # rebases of the 22 line — which is where the security fixes are — still come through.
      - dependency-name: "node"
        update-types: [version-update:semver-major]

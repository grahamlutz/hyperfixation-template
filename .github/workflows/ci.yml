name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `@hyperfixation/testing` creates a database per test on this cluster and drops it after.
      HF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # `flow-restart.test.ts` spawns a real worker, and `startWorker()` refuses a version
      # shorter than 7 characters. The harness overrides this per worker; this covers the
      # in-process half.
      HF_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The contract suite. `flow-restart.test.ts` runs every registered flow through a restart
      # under the worker's fence rule, which is what gates a core bump on this app's own shape.
      - run: pnpm test
      # The `build` script, so the flag it carries is the one the image build uses too.
      # Prerendering `/auth/passkey` reads `REQUIRED_ENV` (src/env.ts) at build time, so this
      # step needs the same dummy values the `compose` job below uses.
      - run: pnpm build
        env:
          HF_PROCESS: web
          DATABASE_URL: postgres://unused
          MIGRATOR_DATABASE_URL: postgres://unused
          APP_URL: https://unused
          BETTER_AUTH_SECRET: unused
          SMTP_URL: smtp://unused
          EMAIL_FROM: unused@example.com
          SENTRY_DSN: ""
          LANGFUSE_BASE_URL: ""
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""

  # The image, built for real, and asked the questions only the image can answer: does it know
  # which commit it is, and does the stack it is three copies of actually come up? `pnpm build`
  # is the `check` job's business — the Dockerfile runs it too, but nothing here re-asserts it.
  #
  # Independent of `check` on purpose: the two share no artifact, and this job's install is the
  # prod suite's, not the app's.
  image:
    runs-on: ubuntu-latest
    services:
      # The cluster `pnpm test:prod` provisions the deployed app's database on. Its published
      # port is on the runner, which the compose containers reach as `host.docker.internal`
      # through the overlay in `tests/e2e/prod-compose.hostdb.yml`.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Build with the commit as SOURCE_COMMIT
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t hf-image .
      # The ENTRYPOINT script `exec "$@"`s, so this reaches `node` through the same path the
      # deployed container's command does, with the same environment and no database.
      - name: HF_BUILD_SHA is the build arg
        run: docker run --rm hf-image node -e 'process.exit(process.env.HF_BUILD_SHA===process.argv[1]?0:1)' "$GITHUB_SHA"
      # No build arg. The builder resolves the sha from the checkout's own `.git` — which is why
      # `.dockerignore` does not list it — and the entrypoint reads the file the builder wrote.
      # Cheap: the Dockerfile puts the arg last in both stages, so this reuses the install, the
      # `next build` and every copy of the build above.
      - name: Build without SOURCE_COMMIT
        run: docker build -t hf-image-fallback .
      - name: The entrypoint falls back to the checkout's HEAD
        run: |
          docker run --rm hf-image-fallback node -e '
            const sha = process.env.HF_BUILD_SHA ?? "";
            if (sha.length < 7) {
              console.error(`HF_BUILD_SHA is ${JSON.stringify(sha)}`);
              process.exit(1);
            }
            console.log(`HF_BUILD_SHA=${sha}`);
          '
      # D3: the stack itself. `pnpm test:prod` generates an app out of this template, creates
      # its database and roles on the service container above, and brings all three services up
      # off one build — so this needs a toolchain, which the two steps above did not.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The prod stack comes up
        run: pnpm test:prod tests/e2e/prod-compose.e2e.ts
      # D4, in this job rather than one of its own: it wants the same Docker, the same cluster
      # and the same install, and its two builds reuse every layer the steps above cached. It is
      # a step of its own only so each chunk's wall clock is readable separately.
      - name: A redeploy across a step change
        run: pnpm test:prod tests/e2e/prod-redeploy.e2e.ts

  # The deploy shape is checked by `compose-envs.test.ts` above, which reads the file; this
  # asserts Docker itself can resolve it — interpolation, the `x-app` anchor, the build args.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          DATABASE_URL: postgres://unused
          MIGRATOR_DATABASE_URL: postgres://unused
          APP_URL: https://unused
          BETTER_AUTH_SECRET: unused
          SMTP_URL: smtp://unused
          EMAIL_FROM: unused@example.com
          SENTRY_DSN: ""
          LANGFUSE_BASE_URL: ""
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""

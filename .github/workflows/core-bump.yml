name: Core bump

# Every `@hyperfixation/*` package is released in lockstep, so an app upgrades all of them or
# none of them: a mixed set is a combination nothing was tested against, and
# `tests/core-version.test.ts` is what holds the installed tree to that.
#
# The routine bump PRs are opened by core's own release job, under its GitHub App token. This
# workflow is the deliberate manual path only — pinning to a version, or re-running a bump the
# release did not open — which is why the `repository_dispatch` trigger it used to carry is
# gone: two openers racing on one `core-bump/<version>` branch is one PR too many.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The @hyperfixation/* version to move to. Empty means the latest published
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # The same cluster `ci.yml`'s `check` job gives the suite below: without it `pnpm test` has
    # no database to create its per-test ones on, fails for that reason alone under
    # `continue-on-error`, and says nothing about the bump — which is the one thing the step is
    # here to say.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HF_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Move every @hyperfixation/* package together
        id: version
        # Through the environment, not `${{ }}` inside the script: a workflow_dispatch input is
        # attacker-controlled text as far as the shell is concerned.
        env:
          PIN: ${{ inputs.version }}
        run: |
          set -eu
          PACKAGES=$(node -e '
            const pkg = require("./package.json");
            const all = { ...pkg.dependencies, ...pkg.devDependencies };
            console.log(Object.keys(all).filter((n) => n.startsWith("@hyperfixation/")).join(" "));
          ')
          test -n "$PACKAGES"
          if [ -n "$PIN" ]; then
            SPECS=""
            for p in $PACKAGES; do SPECS="$SPECS $p@$PIN"; done
            pnpm update $SPECS
          else
            pnpm update --latest $PACKAGES
          fi
          pnpm install --frozen-lockfile=false
          # Read back rather than trust the input: with none given, `--latest` is what decided.
          # By path: the package's `exports` map makes `@hyperfixation/core/package.json` a
          # resolver error.
          VERSION=$(node -e 'console.log(require("./node_modules/@hyperfixation/core/package.json").version)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The PR is opened whether or not this passes; a bump that breaks the app's contract
      # suite is exactly the thing the PR exists to show, and a silent failure here would
      # hide it. `ci.yml` is what actually gates the merge.
      - run: pnpm test
        continue-on-error: true

      # Opened with GITHUB_TOKEN, so this PR does not trigger `ci.yml` — run this path with a
      # PAT in `token:` when the bump needs CI, or push an empty commit to the branch.
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: core-bump/${{ steps.version.outputs.version }}
          commit-message: "Move @hyperfixation/* to ${{ steps.version.outputs.version }}"
          title: "Move @hyperfixation/* to ${{ steps.version.outputs.version }}"
          body: |
            Every `@hyperfixation/*` package moved together to
            `${{ steps.version.outputs.version }}`.

            This app's own contract suite — `flow-restart.test.ts` included — gates the merge.
            A red CI here means the release changed something this app's flows depend on; read
            the failure before overriding it.

# TEMPORARY — delete this file at the first `@hyperfixation/*` publish.
#
# This is not a monorepo; the only reason pnpm needs a settings file here is `overrides`, which
# pnpm 12 reads from `pnpm-workspace.yaml` and no longer from `package.json`.
#
# `package.json` declares the real, future dependency: `"@hyperfixation/core": "^0.0.0"` and so
# on, which is what an app gets once the packages are on npm. None of them are published yet,
# so every install would 404. These overrides point each one at the sibling `hyperfixation-core`
# checkout instead, which is the Phase 1 development layout:
#
#   Code/
#     hyperfixation/            (hyperfixation-core, the packages)
#     hyperfixation-template/   (this repo)
#
# They resolve to the packages' built `dist/`, so `pnpm -r build` in hyperfixation-core has to
# have run. Track E (`hf new`) and the publish step own removing this: once the packages
# resolve from the registry, deleting this file is the whole change.

overrides:
  "@hyperfixation/admin": "link:../hyperfixation/packages/admin"
  "@hyperfixation/ai": "link:../hyperfixation/packages/ai"
  "@hyperfixation/auth": "link:../hyperfixation/packages/auth"
  "@hyperfixation/core": "link:../hyperfixation/packages/core"
  "@hyperfixation/db": "link:../hyperfixation/packages/db"
  "@hyperfixation/eslint-config": "link:../hyperfixation/packages/eslint-config"
  "@hyperfixation/testing": "link:../hyperfixation/packages/testing"
  "@hyperfixation/workflows": "link:../hyperfixation/packages/workflows"

  # Same bridge, one level down. Two checkouts mean two pnpm stores, so `drizzle-orm@0.45.2`
  # installed here and `drizzle-orm@0.45.2` installed there are two physically distinct copies
  # with two distinct declarations of `SQL`'s private fields — and a flow's `db.execute(sql...)`
  # stops typechecking against a step handle that came from the other one. Published, both
  # resolve from one store at one version and the problem does not arise.
  "drizzle-orm": "link:../hyperfixation/packages/db/node_modules/drizzle-orm"
  # The SDK is pinned to one exact version across hyperfixation-core so that every package
  # links the same copy and `DBOS` is one object in a process. That has to hold across the
  # bridge too, or the worker fixture would patch a different `DBOS.shutdown` than the one
  # `startWorker()` calls.
  "@dbos-inc/dbos-sdk": "link:../hyperfixation/packages/workflows/node_modules/@dbos-inc/dbos-sdk"

# vitest pulls esbuild; the same allowance hyperfixation-core makes.
allowBuilds:
  esbuild: true

# This is not a monorepo. The file survives only for `allowBuilds`, which pnpm 12 reads from
# here and no longer from `package.json`; the `@hyperfixation/*` link overrides it used to carry
# are gone now that the packages resolve from npm.

# vitest pulls esbuild; the same allowance hyperfixation-core makes.
allowBuilds:
  # `false`, and it has to be answered: `@sentry/nextjs` reaches `@sentry/cli` through the
  # webpack plugin, whose postinstall downloads a binary. Nothing here uploads source maps, and
  # pnpm fails an install outright on a build script no one has decided about.
  "@sentry/cli": false
  esbuild: true
